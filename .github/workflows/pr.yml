name: "Terraform PR Check"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # fmt roda na raiz: cobre modules/ e environments/, nao so o ambiente atual
      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'sa-east-1' }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_vpc_id: ${{ vars.VPC_ID }}
          TF_VAR_vpc_cidr_block: ${{ vars.VPC_CIDR_BLOCK }}
          TF_VAR_subnet_ids: ${{ vars.SUBNET_IDS }}
          TF_VAR_eks_security_group_id: ${{ vars.EKS_SECURITY_GROUP_ID }}
          TF_VAR_alarm_sns_topic_arns: ${{ vars.ALARM_SNS_TOPIC_ARNS || '[]' }}
        run: terraform plan -input=false -no-color
